<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Enríquez y Asociados — Asistente Virtual</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--p:#2baacc;--bg:#c5d2d8;--chat-bg:#f7fafc;--bot-bg:#3e5598;--bot-text:#f4f5f6;--user-text:#ffffff;--dark:#2D3440;--muted:#8A95A3}
html,body{min-height:100%;font-family:Inter,sans-serif;background:var(--bg);color:var(--dark)}
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem;height:100%;overflow:hidden}
.card{width:100%;max-width:440px;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,0.1);display:flex;flex-direction:column;height:100%}
.hdr{padding:0.85rem 1.25rem 0.85rem;text-align:center;background:linear-gradient(160deg,#f0faff,#fff);border-bottom:1px solid #eef2f5;flex-shrink:0}
.biz-logo{width:56px;height:56px;border-radius:50%;border:2px solid var(--p);margin:0 auto 0.5rem;display:flex;align-items:center;justify-content:center;font-size:1.5rem;overflow:hidden;background:rgba(43,170,204,0.1)}
.biz-logo img{width:100%;height:100%;object-fit:contain}
.biz-name{font-family:Montserrat,sans-serif;font-size:0.92rem;font-weight:800;color:var(--dark)}
.biz-tag{font-size:0.7rem;color:var(--muted);margin-top:0.1rem}
.biz-meta{margin-top:0.5rem;display:flex;flex-direction:column;gap:0.2rem}
.mr{font-size:0.68rem;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:0.35rem}
.mr a{color:var(--p);text-decoration:none;font-weight:500}
.messages{overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:0.65rem;background:var(--chat-bg);flex:1;min-height:0}
.messages::-webkit-scrollbar{width:4px}.messages::-webkit-scrollbar-thumb{background:#dde3e8;border-radius:99px}
.msg{max-width:82%;display:flex;flex-direction:column;gap:0.2rem;animation:fu 0.2s ease}
@keyframes fu{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.msg.bot{align-self:flex-start}.msg.user{align-self:flex-end}
.bubble{padding:0.65rem 0.9rem;border-radius:14px;font-size:0.82rem;line-height:1.55;white-space:pre-wrap}
.msg.bot .bubble{background:var(--bot-bg);color:var(--bot-text);border:1px solid #e5eaee;border-bottom-left-radius:4px}
.msg.user .bubble{background:var(--p);color:var(--user-text);border-bottom-right-radius:4px}
.ts{font-size:0.62rem;color:var(--muted);padding:0 0.2rem}.msg.user .ts{text-align:right}
.typing{display:flex;align-items:center;gap:4px;padding:0.65rem 0.9rem;background:#fff;border:1px solid #e5eaee;border-radius:14px;border-bottom-left-radius:4px;width:fit-content;align-self:flex-start}
.td{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:tb 1.2s infinite ease-in-out}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes tb{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.qrs{display:flex;flex-wrap:wrap;gap:0.4rem;padding:0.2rem}
.qr{background:rgba(43,170,204,0.1);color:var(--p);font-size:0.72rem;font-weight:600;padding:0.35rem 0.75rem;border-radius:999px;border:1px solid rgba(43,170,204,0.25);cursor:pointer;transition:all 0.15s}
.qr:hover{background:var(--p);color:#fff}
.input-row{display:flex;gap:0.5rem;padding:0.85rem 1rem;border-top:1px solid #eef2f5;background:#fff;flex-shrink:0}
.inp{flex:1;border:1px solid #dde3e8;border-radius:10px;padding:0.65rem 0.9rem;font-size:0.82rem;outline:none;background:#f9fbfc;transition:border-color 0.15s;resize:none;overflow-y:auto;max-height:90px;font-family:Inter,sans-serif}
.inp:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(43,170,204,0.1);background:#fff}
#sendbtn{width:40px;height:40px;background:var(--p);color:#fff;border:none;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;align-self:flex-end}
#sendbtn:disabled{opacity:0.4;cursor:not-allowed}
#sendbtn svg{width:17px;height:17px}
.powered{font-size:0.65rem;color:var(--muted);text-align:center;margin-top:0.85rem}
.powered strong{color:var(--p);font-family:Montserrat,sans-serif}
</style>
</head>

<script>
var _C=JSON.parse(document.getElementById('chatbot-config').textContent);
var GKEY=decodeURIComponent(escape(atob(_C.key)));
var GDOC=decodeURIComponent(escape(atob(_C.doc)));
var docContent=null,hist=[],busy=false;

async function loadDoc(){
  if(!GDOC)return;
  try{
    var r=await fetch('https://docs.google.com/document/d/'+GDOC+'/export?format=txt');
    if(!r.ok){console.warn('Doc error:',r.status);return;}
    docContent=await r.text();
    console.log('Doc loaded:',docContent.length,'chars');
  }catch(e){
    console.warn('Doc fetch failed:',e.message);
    var statusEl=document.getElementById('doc-status');
    if(statusEl){statusEl.textContent='⚠️ No se pudo cargar la info del negocio. Verificá que el Google Doc esté compartido públicamente.';statusEl.style.display='block';}
  }
}

function buildSystem(){
  var doc=docContent ? '=== INFORMACIÓN DEL NEGOCIO ===\n'+docContent+'\n=== FIN INFORMACIÓN ==' : '';
  var contact=_C.contact ? '\nDATOS DE CONTACTO DEL NEGOCIO:\n'+_C.contact : '';
  var prompt=[
    'Sos el asistente virtual de '+_C.bizName+'. '+_C.sp,
    doc,
    contact,
    'REGLAS:',
    '- Respondé SIEMPRE basándote en la información del negocio que está arriba.',
    '- Si la información está en el documento, usala para responder.',
    '- Si realmente no tenés el dato, decí exactamente: puede ayudarte mejor nuestro equipo. y ofrecé los datos de contacto.',
    '- NUNCA menciones documentos ni fuentes al responder.',
    '- Texto plano sin markdown. Sin asteriscos ni guiones para listas.',
    '- Cuando listes ítems usá bullets con el símbolo • (ejemplo: • Servicio 1).',
    '- Podés usar emojis.',
    '- No termines con preguntas de seguimiento.',
    '- Respondé en español, de forma amigable y concisa.'
  ].join('\n');
  return prompt;
}

function addMsg(role,text){
  hist.push({role:role,content:text});
  var c=document.getElementById('msgs');
  var w=document.createElement('div');w.className='msg '+role;
  var b=document.createElement('div');b.className='bubble';b.textContent=text;
  var t=document.createElement('div');t.className='ts';t.textContent=now();
  w.appendChild(b);w.appendChild(t);c.appendChild(w);
  c.scrollTop=c.scrollHeight;
}

function showTyp(){
  var c=document.getElementById('msgs');
  var el=document.createElement('div');el.className='typing';el.id='typ';
  el.innerHTML='<div class="td"></div><div class="td"></div><div class="td"></div>';
  c.appendChild(el);c.scrollTop=c.scrollHeight;
}
function rmTyp(){var t=document.getElementById('typ');if(t)t.remove();}
function updateTyping(text){
  var t=document.getElementById('typ');
  if(t)t.textContent=text;
}

function addQR(opts){
  var c=document.getElementById('msgs');
  var w=document.createElement('div');w.className='qrs';w.id='qrs';
  opts.forEach(function(o){
    var btn=document.createElement('button');btn.className='qr';btn.textContent=o;
    btn.onclick=function(){var q=document.getElementById('qrs');if(q)q.remove();doSend(o);};
    w.appendChild(btn);
  });
  c.appendChild(w);c.scrollTop=c.scrollHeight;
}

function ar(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,90)+'px';}
function hk(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}

function sendMsg(){
  var inp=document.getElementById('inp');
  var txt=inp.value.trim();if(!txt||busy)return;
  inp.value='';inp.style.height='auto';
  var q=document.getElementById('qrs');if(q)q.remove();
  clearTimers();
  doSend(txt);
}

async function doSend(txt){
  addMsg('user',txt);
  busy=true;document.getElementById('sendbtn').disabled=true;showTyp();
  var oaiMessages=[{role:'system',content:buildSystem()}];
  hist.forEach(function(m){
    oaiMessages.push({role:m.role==='bot'?'assistant':'user',content:m.content});
  });
  var allContents=oaiMessages;
  var maxRetries=3,attempt=0,done=false;
  while(!done){
    try{
      if(attempt>0){
        await new Promise(function(res){setTimeout(res,attempt*3000);});
      }
      var r=await fetch(
        'https://api.openai.com/v1/chat/completions',
        {method:'POST',
         headers:{'Content-Type':'application/json','Authorization':'Bearer '+GKEY},
         body:JSON.stringify({model:'gpt-4o-mini',max_tokens:800,temperature:0.7,messages:allContents})}
      );
      var d=await r.json();
      var overload=d.error&&(d.error.code===429||d.error.type==='insufficient_quota'||
        (d.error.message&&d.error.message.indexOf('rate limit')>-1));
      if(overload&&attempt<maxRetries-1){attempt++;continue;}
      rmTyp();
      if(d.error){
        var _phone='',_email='';
        if(_C.contact){var _cl=_C.contact.split(String.fromCharCode(10));_cl.forEach(function(l){if(l.indexOf('Tel')>-1)_phone=l.replace(/.*:/,'').trim();if(l.indexOf('Email')>-1||l.indexOf('email')>-1)_email=l.replace(/.*:/,'').trim();});}
        var _fb='En este caso, puede ayudarte mejor nuestro equipo. Si deseas obtener más detalles sobre la modalidad de trabajo, te sugiero que te pongas en contacto directamente con '+_C.bizName+'. Aquí tienes sus datos:';
        if(_phone)_fb+=' 📞 Teléfono: '+_phone;
        if(_email)_fb+=' ✉️ Email: '+_email;
        if(!_phone&&!_email&&_C.contact)_fb+=' '+_C.contact;
        _fb+=' ¡Espero que te sea útil!';
        logUnanswered(txt);
        addMsg('bot',_fb);
      }else{
        var reply=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||'No pude generar una respuesta.';
        if(reply.indexOf('puede ayudarte mejor nuestro equipo')>-1){logUnanswered(txt);}
        addMsg('bot',reply);
      }
      scheduleFollowUp();
      done=true;
    }catch(e){
      attempt++;
      if(attempt>=maxRetries){
        rmTyp();
        addMsg('bot','Lo siento, hay un problema de conexión. Comunicate con nosotros: '+(_C.contact||''));
        done=true;
      }
    }
  }
  busy=false;document.getElementById('sendbtn').disabled=false;
  document.getElementById('inp').focus();
}

var followUpTimer=null,closeTimer=null;

function clearTimers(){
  if(followUpTimer)clearTimeout(followUpTimer);
  if(closeTimer)clearTimeout(closeTimer);
  followUpTimer=null;closeTimer=null;
}

function scheduleFollowUp(){
  clearTimers();
  closeTimer=setTimeout(function(){
    addMsg('bot','Fue un placer ayudarte. ¡Hasta pronto! 👋');
    document.getElementById('inp').disabled=true;
    document.getElementById('sendbtn').disabled=true;
    var row=document.getElementById('inp').closest('.input-row');
    if(row)row.style.opacity='0.4';
  },120000);
}

function logUnanswered(question){
  if(!_C.sheets)return;
  try{
    var now=new Date();
    var fecha=now.toLocaleDateString('es-AR');
    var hora=now.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
    var params='fecha='+encodeURIComponent(fecha)+'&hora='+encodeURIComponent(hora)+'&cliente='+encodeURIComponent(_C.bizName)+'&pregunta='+encodeURIComponent(question);
    var xhr=new XMLHttpRequest();
    xhr.open('GET',_C.sheets+'?'+params,true);
    xhr.send();
  }catch(e){}
}

loadDoc().then(function(){
  addMsg('bot',_C.welcome);
  if(_C.qr){
    var opts=_C.qr.split('|').map(function(s){return s.trim();}).filter(Boolean);
    if(opts.length)addQR(opts);
  }
});
</script>
